<!DOCTYPE html>
<html>
<head>
    <title>Cars Array</title>
</head>
<body>

    <h1>Cars Array Challenge</h1>
    <p>Open the browser console (press F12) to see the results.</p>

    <script>
        // Step 1: Define the cars array
        let cars = ["toyota", "honda", "mazda", "mitsubishi", "tesla", "lexus"];

        // Step 2: Log first item and last item
        console.log("First item: " + cars[0]);
        console.log("Last item: " + cars[cars.length - 1]);

        // Step 3: Add mercedes-benz to the array
        cars.push("mercedes-benz");
        console.log("After adding mercedes-benz: " + cars);

        // Step 4: Loop through all items and log them
        console.log("All cars in the array:");
        for (let i = 0; i < cars.length; i++) {
            console.log(cars[i]);
        }
    </script>

</body>
</html>
